<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
<title id="title">MovieCompanion playback boundary</title><desc id="desc">Conceptual workflow: subtitle files and the visible playback timestamp produce a safe context, eight seconds behind estimated playback. Later cues remain outside the answer context.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#161b30"/><stop offset="1" stop-color="#28263c"/></linearGradient></defs>
<rect width="1120" height="400" rx="24" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="48" y="54" fill="#f1d9a8" font-size="13" letter-spacing="3">MOVIECOMPANION / HOW IT WORKS</text><text x="48" y="101" fill="#fff8ec" font-size="32" font-weight="700">Stay with the scene. Not ahead of it.</text>
<rect x="48" y="135" width="270" height="107" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#b2a9c4" stroke-opacity=".25"/><text x="70" y="170" fill="#fff8ec" font-size="21">01  Index text tracks</text><text x="70" y="204" fill="#c4c2d4" font-size="17">Dialogue + optional description</text>
<path d="M332 187h32m-9-7 9 7-9 7" fill="none" stroke="#eecf91" stroke-width="2"/>
<rect x="380" y="135" width="314" height="107" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#b2a9c4" stroke-opacity=".25"/><text x="402" y="170" fill="#fff8ec" font-size="21">02  Sync your timestamp</text><text x="402" y="204" fill="#c4c2d4" font-size="17">Elapsed time × playback rate</text>
<path d="M708 187h32m-9-7 9 7-9 7" fill="none" stroke="#eecf91" stroke-width="2"/>
<rect x="756" y="135" width="316" height="107" rx="14" fill="#d5b574" fill-opacity=".15" stroke="#d5b574" stroke-opacity=".6"/><text x="778" y="170" fill="#fff8ec" font-size="21">03  Ask from safe cues</text><text x="778" y="204" fill="#e7d9bb" font-size="17">Only cues ending by safe_time</text>
<line x1="48" y1="303" x2="1072" y2="303" stroke="#777289" stroke-width="4"/><line x1="48" y1="303" x2="730" y2="303" stroke="#eecf91" stroke-width="4"/><circle cx="730" cy="303" r="7" fill="#eecf91"/><circle cx="882" cy="303" r="7" fill="#fff8ec"/>
<text x="48" y="340" fill="#eecf91" font-size="16">Available subtitle context</text><text x="730" y="277" text-anchor="middle" fill="#eecf91" font-size="15">safe_time</text><text x="882" y="277" text-anchor="middle" fill="#fff8ec" font-size="15">estimated playback</text><text x="805" y="340" text-anchor="middle" fill="#c4c2d4" font-size="15">8-second default lag</text><text x="1072" y="340" text-anchor="end" fill="#aaa5bc" font-size="15">Later cues excluded</text>
<text x="48" y="379" fill="#9692aa" font-size="12">Conceptual diagram, not a player screenshot. Timing and subtitle alignment still need verification.</text></g></svg>
